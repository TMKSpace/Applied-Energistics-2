plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
	maven {
		url = 'https://central.sonatype.com/repository/maven-snapshots/'
		content {
			includeModule('org.appliedenergistics', 'guideme')
		}
	}
	// Сторонние API для компиляции интеграций AE2.
	// ВАЖНО: maven.blamejared.com (JEI, Jade) и maven.shedaniel.me (REI) с этой машины
	// не отвечают (таймаут TLS), поэтому берём те же моды с Modrinth, где они лежат
	// как обычные файлы. MC 26.x не обфусцирован, поэтому production-джар мода
	// годится в compileClasspath напрямую: в нём имена MC-классов уже настоящие
	// (проверено: в JEI 0 ссылок на intermediary class_XXXX).
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup('maven.modrinth')
		}
	}
	// Team Reborn Energy (MIT): API Fabric-энергии, на нём стоит TechReborn.
	// Нужен для моста в обе стороны, см. nfcompat.bridge.FabricEnergy*.
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
		content {
			includeGroup('teamreborn')
		}
	}
}

// ВАЖНО: splitEnvironmentSourceSets НЕ включаем.
// AE2 держит весь клиентский код в main (appeng.client.*), а не в отдельном client-сорсете,
// и спокойно использует com.mojang.blaze3d / gui-классы из main. Разделение окружений
// на Fabric выкинуло бы из main весь client-only API MC.
loom {
	mods {
		"appliedenergistics2" {
			sourceSet sourceSets.main
		}
	}
	// AT из NeoForge-сборки сконвертирован в accesswidener (31 запись + 6 для шима)
	accessWidenerPath = file("src/main/resources/ae2.accesswidener")
}

sourceSets {
	main {
		java {
			// Исходники AE2 идут не напрямую, а через препроцессор (см. задачу preprocessSources).
			// Он разворачивает маркеры //#if FABRIC / //#else / //#endif, чтобы в одном файле
			// жили оба варианта: NeoForge-овский и наш. Для NeoForge-сборки маркеры — просто
			// комментарии, поэтому файлы остаются валидными и там.
			//
			// ВАЖНО: именно присваивание, а не srcDir — иначе остаётся дефолтный src/main/java
			// и дерево компилируется дважды.
			srcDirs = [
				layout.buildDirectory.dir('nfcompatSrc').get().asFile.path,
				'src/main/flatbuffers/generated',
				'compat/java'       // <- ШИМ: net.neoforged.* поверх Fabric (извлекаемый)
			]

			// WTHIT на Fabric не существует — интеграция вырезана целиком.
			// Ссылок на её классы снаружи нет, только упоминания в javadoc.
			exclude 'appeng/integration/modules/wthit/**'

			// EMI: официальных сборок под 26.3 нет вообще (на Modrinth максимум 1.21.1).
			// Единственная точка касания — два файла конвертеров, снаружи ссылок нет.
			exclude 'appeng/client/api/integrations/emi/**'
		}
		resources {
			srcDir 'src/generated/resources'
			srcDir 'src/client/resources'
			srcDir 'compat/resources'   // fabric.mod.json шима и прочие его ресурсы
		}
	}
}

// ---------------------------------------------------------------------------
// Сорсет shimTest: тесты шима и core-механик.
//
// Исторически main был красным (сотни ошибок в неотрефакторенных исходниках AE2), поэтому
// shimTest компилировал сам `compat/java` и не зависел от main.output. Сейчас main зелёный,
// а шим вырос: часть классов `nfcompat/**` ссылается на AE2 (`appeng.*`), и без main.output
// такой сорсет просто не собирается. Поэтому тесты берут шим из main как обычный
// потребитель: свой srcDir — только `src/shimTest/java`.
// ---------------------------------------------------------------------------
sourceSets {
	shimTest {
		java.srcDirs = ['src/shimTest/java']
		// Ресурсы шима для тестов не нужны (fabric.mod.json, mixins.json и т.п.)
		resources.srcDirs = []
		compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath + configurations.shimTestCompileClasspath
		runtimeClasspath = output + compileClasspath + configurations.shimTestRuntimeClasspath
	}
}

// ---------------------------------------------------------------------------
// Сорсет test: юнит-тесты самого AE2 (`src/test/java`, апстрим — не правим).
//
// Тесты берут классы и ресурсы main как обычный потребитель (main зелёный),
// поэтому srcDirs/srcDir явно, без опоры на дефолты Loom.
//
// Исключений по файлам нет: NeoForge test framework, на который завязан апстрим
// (`net.neoforged.testframework.junit.EphemeralTestServerProvider` + `@BootstrapMinecraft`),
// портирован в compat/java под тем же FQN. См. EphemeralTestServerProvider.java.
// ---------------------------------------------------------------------------
sourceSets {
	test {
		java {
			srcDirs = ['src/test/java']

			// Апстримные тесты написаны под другую ревизию ванильного/NeoForge API и
			// на нашем 26.3 не компилируются даже с портированным test framework.
			// Это НЕ пробел шима: чинится только правкой src/test (запрещено) или
			// ревизией самой ваниллы/NeoForge-патча.
			// - Item#getMaxDamage(ItemStack) в 26.3 нет (прочность уехала в item stack/components)
			exclude 'appeng/api/stacks/AEItemKeyTest.java'
			// - Language#getLanguageData() есть только у ClientLanguage (нужен каст)
			exclude 'appeng/client/InitScreensTest.java'
			// - RecipeOutput#accept(..., ICondition...) - это NeoForge-патч, у ванили 3 аргумента;
			//   RecipeManager#recipeMap() в 26.3 нет (поле private Map)
			exclude 'appeng/crafting/pattern/AECraftingPatternTest.java'
			// - SavedDataStorage(Level, Path, DataFixer, RegistryAccess) - старый ctor,
			//   в 26.3 он (Path, DataFixer, HolderLookup.Provider)
			exclude 'appeng/server/services/compass/ServerCompassServiceTest.java'
		}
		resources.srcDirs = []
		compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath + configurations.testCompileClasspath
		runtimeClasspath = output + compileClasspath + configurations.testRuntimeClasspath
	}
}

// ---------------------------------------------------------------------------
// Препроцессор: //#if FABRIC / //#if NEOFORGE / //#else / //#endif
//
// Java препроцессора не имеет, а сигнатуры ванильных конструкторов NeoForge меняет,
// поэтому часть мест физически не собрать одним и тем же кодом. Маркеры — комментарии,
// так что файл остаётся валидным и для NeoForge; исключённые строки заменяются пустыми,
// чтобы номера строк не съезжали.
//
// Поддерживается вложенность и отрицание: //#if !FABRIC
// ---------------------------------------------------------------------------
def preprocessSourceDirs = [file('src/main/java'), file('src/client/java')]

tasks.register('preprocessSources') {
	def outDir = layout.buildDirectory.dir('nfcompatSrc')
	inputs.files(preprocessSourceDirs)
	inputs.property('flavor', 'FABRIC')
	outputs.dir(outDir)

	doLast {
		def dest = outDir.get().asFile
		dest.deleteDir()
		dest.mkdirs()

		int total = 0
		int marked = 0

		preprocessSourceDirs.each { dir ->
			if (!dir.exists()) {
				return
			}
			fileTree(dir).matching { include '**/*.java' }.each { src ->
				def rel = dir.toPath().relativize(src.toPath()).toString()
				def dst = new File(dest, rel)
				dst.parentFile.mkdirs()

				def lines = src.getText('UTF-8').split('\n', -1)
				def sb = new StringBuilder()
				// кадр: [активность снаружи, условие кадра]
				def frames = new ArrayDeque<List>()
				boolean active = true
				boolean fileMarked = false

				for (String line : lines) {
					def t = line.trim()
					if (t.startsWith('//#if ')) {
						def cond = evaluateCondition(t.substring('//#if '.length()).trim())
						frames.push([active, cond])
						active = active && cond
						fileMarked = true
						sb.append('\n')
					} else if (t.startsWith('//#else')) {
						if (frames.isEmpty()) {
							throw new GradleException("//#else без //#if: " + src)
						}
						def f = frames.pop()
						def cond = !f[1]
						frames.push([f[0], cond])
						active = f[0] && cond
						fileMarked = true
						sb.append('\n')
					} else if (t.startsWith('//#endif')) {
						if (frames.isEmpty()) {
							throw new GradleException("//#endif без //#if: " + src)
						}
						active = frames.pop()[0]
						fileMarked = true
						sb.append('\n')
					} else {
						sb.append(active ? line : '').append('\n')
					}
				}

				if (!frames.isEmpty()) {
					throw new GradleException("незакрытый //#if: " + src)
				}

				// у split(-1) последний элемент — хвост после финального \n
				def text = sb.toString()
				if (text.endsWith('\n')) {
					text = text.substring(0, text.length() - 1)
				}
				dst.setText(text, 'UTF-8')

				total++
				if (fileMarked) {
					marked++
				}
			}
		}
		logger.lifecycle("preprocess: файлов ${total}, с маркерами ${marked}")
	}
}

static boolean evaluateCondition(String cond) {
	switch (cond) {
		case 'FABRIC':
			return true
		case 'NEOFORGE':
			return false
		case '!FABRIC':
			return false
		case '!NEOFORGE':
			return true
		default:
			throw new GradleException("неизвестное условие препроцессора: " + cond)
	}
}

tasks.named('compileJava') {
	dependsOn 'preprocessSources'
}

// ---------------------------------------------------------------------------
// Fabric-датаген (fabric-data-generation-api-v1).
//
// Вход — appeng.datagen.AE2DataGenerators (src/client/java/appeng/datagen/), он же
// зарегистрирован как entrypoint "fabric-datagen" в compat/resources/fabric.mod.json.
// Задача runDatagen создаётся самим Loom'ом (createRunConfiguration).
//
// ВАЖНО про вывод: дефолт Loom — src/main/generated, а в репо уже лежат апстримные
// JSON'ы в src/generated/resources (они подключены как ресурсы main). Прогон туда
// затирать нельзя, поэтому пишем в build/datagen-out, а addToResources выключаем —
// сгенерированное не должно утекать ни в main resources, ни в jar.
// createSourceSet=false: отдельный `datagen` сорсет не нужен, вход уже в main.
// client=true: модели, локализация и партиклы генерятся только в клиентском режиме.
// ---------------------------------------------------------------------------
fabricApi {
	configureDataGeneration {
		client = true
		modId = 'ae2'
		outputDirectory = file('build/datagen-out')
		addToResources = false
		createSourceSet = false
	}
}

// ---------------------------------------------------------------------------
// Gametest: запуск ванильного GameTestServer (реестровый путь: Registries.TEST_INSTANCE,
// Registries.TEST_ENVIRONMENT) из Fabric-раннера.
//
// createSourceSet=false — тесты живут не в отдельном сорсете (appeng.server.testplots
// и так в main), enableClientGameTests=false — клиент не поднимаем (нет GUI и лишнего
// run-каталога), eula=true — Loom сам кладёт eula.txt в СВОЙ run-каталог
// (build/run/gameTest), сервер пользователя в D:\Servers\Minecraft не затрагивается.
//
// GameTestServer не публикуется в сеть (isPublished() = false) и порт не слушает,
// так что конфликта с чужим сервером нет даже при дефолтном server-port.
//
// -Dappeng.tests=true включает регистрацию тестплотов AE2 (AppEngBase#registerTests).
// -Dfabric-api.gametest.filter — НЕ regex, а ванильный resource selector
// (ResourceSelectorArgument): `*` = только namespace minecraft, `*:*` = все,
// `ae2:tiny_tnt*` = группа плотов. id теста = id плота.
// ---------------------------------------------------------------------------
fabricApi {
	configureTests {
		createSourceSet = false
		enableClientGameTests = false
		eula = true
	}
}

loom {
	runs {
		gameTest {
			vmArg '-Dappeng.tests=true'
			// Включает реестровый путь: GameTestHooks.isGametestEnabled() ->
			// пост RegisterGameTestsEvent до заморозки TEST_INSTANCE.
			vmArg '-Dneoforge.gametest.enabled=true'
			// По умолчанию гоняем весь набор. Один плот: -PgtFilter=ae2:tiny_tnt*
			vmArg "-Dfabric-api.gametest.filter=${project.findProperty('gtFilter') ?: '*:*'}"
		}
	}
}

// configureTests вешает runGameTest в check. Нам это не нужно: `gradlew build`
// не должен поднимать игровой сервер. Убираем только эту зависимость.
tasks.matching { it.name == 'check' }.configureEach {
	setDependsOn(dependsOn.findAll { !it.toString().toLowerCase().contains('gametest') })
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.x поставляется необфусцированным — mappings не задаются вообще
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("org.appliedenergistics:guideme:${project.guideme_version}")

	implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
	implementation "io.methvin:directory-watcher:${project.directory_watcher_version}"
	implementation "com.google.flatbuffers:flatbuffers-java:${project.flatbuffers_version}"

	implementation "org.jspecify:jspecify:1.0.0"
	implementation "org.jetbrains:annotations:26.0.2"

	// Только для компиляции: в compat/java лежит порт NeoForge EphemeralTestServerProvider
	// (net.neoforged.testframework.junit) - это JUnit 5 extension, нужный юнит-тестам AE2.
	// В рантайме игры он не загружается, поэтому compileOnly, а не implementation.
	compileOnly "org.junit.jupiter:junit-jupiter-api:5.13.4"

	// --- Моды в рантайме dev-клиента ---
	// Те же артефакты, что и compileOnly ниже, но подключённые в рантайм: иначе
	// Fabric их не увидит при запуске. В Loom 1.19 (MC 26.x, без обфускации) mod*
	// конфигураций больше нет — dev-рантайм набирается через localRuntime.
	localRuntime "maven.modrinth:jei:zX75GFgt"                    // 31.17.0.113 fabric
	localRuntime "maven.modrinth:jade:71CTWqdE"                   // 26.3.5+fabric
	localRuntime "maven.modrinth:modmenu:xckkBHD5"                // 21.0.1 fabric

	// MCPFabric: встроенный в игру HTTP-мост (127.0.0.1:25599), через который агент
	// сам ставит блоки, читает инвентарь, выполняет команды и делает скриншоты.
	// Только для рантайма, в компиляции не нужен. Лежит в libs/ (см. .gitignore).
	localRuntime files("libs/mcpfabric-0.10.0+26.3.jar")

	// Cloth Config + Mod Menu: только для компиляции экрана настроек (nfcompat.config.ClothConfigScreen).
	// В рантайме их приносит модпак; в релизной сборке заменить на maven-зависимость.
	compileOnly files("libs/cloth-config-fabric-26.3.159.jar", "libs/modmenu-21.0.0.jar")
	localRuntime files("libs/cloth-config-fabric-26.3.159.jar", "libs/modmenu-21.0.0.jar")

	// --- Сторонние API только для компиляции ---
	// nightconfig: движок конфигов, на нём построен вендоренный ModConfigSpec.
	implementation "com.electronwill.night-config:core:3.6.7"
	// TOML-формат для конфигов: как в NeoForge, файл на диске + CommentedFileConfig
	implementation "com.electronwill.night-config:toml:3.6.7"

	// JEI 31.17.0.113 (fabric, 26.3)
	compileOnly "maven.modrinth:jei:zX75GFgt"

	// Jade 26.3.5+fabric
	compileOnly "maven.modrinth:jade:71CTWqdE"

	// REI 26.3.824+fabric
	compileOnly "maven.modrinth:rei:rKsAE6bX"
	compileOnly "maven.modrinth:modmenu:xckkBHD5"

	// Team Reborn Energy 5.0.0: API Fabric-энергии (1 E == 1 FE, пересчёта нет).
	//
	// ЭНЕРГИЮ НЕ ПОСТАВЛЯЕМ. Ни include (JiJ), ни implementation: библиотека чужая,
	// её должен притащить тот, кто эту энергию производит (TechReborn/RebornCore и пр.).
	// Иначе в паке окажется лишний экземпляр мода с id team_reborn_energy.
	// Нет библиотеки — мост энергии выключается целиком (nfcompat.bridge.FabricEnergy,
	// проверка isModLoaded), и AE2 живёт без энергии извне. Так и задумано.
	//
	// compileOnly — только для компиляции моста; localRuntime — чтобы API был в dev-мире
	// и /nfcompat cap мог его опросить.
	compileOnly "teamreborn:energy:5.0.0"
	localRuntime "teamreborn:energy:5.0.0"

	// --- тесты ---
	// JUnit 5 + AssertJ: тесты шима и core-механик не требуют запуска игры.
	// ВАЖНО: версии задаются BOM'ом. Без него Mockito тянет junit-jupiter-api 5.13.4,
	// а объявленный junit-jupiter 5.11.4 держит compileClasspath на 5.11.4 — и на
	// запуске JUnit падает с NoSuchMethodError из-за рассинхрона api/engine/commons.
	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.assertj:assertj-core:3.26.3"
	// Апстримный InternalInventoryTest использует IteratorTester из guava-testlib.
	testImplementation "com.google.guava:guava-testlib:33.6.0-jre"
	// Апстримные тесты AE2 активно мокают (GridNode/Level/реестры), Mockito 5.24
	// тянет byte-buddy, который умеет class-файлы Java 25 (release = 25 ниже).
	testImplementation "org.mockito:mockito-core:5.24.0"
	testImplementation "org.mockito:mockito-junit-jupiter:5.24.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// то же для сорсета shimTest (см. блок sourceSets выше)
	shimTestImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	shimTestImplementation "org.assertj:assertj-core:3.26.3"
	shimTestRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.register('shimTest', Test) {
	group = 'verification'
	description = 'Тесты шима nfcompat: без бутстрапа игры и без сборки AE2.'
	testClassesDirs = sourceSets.shimTest.output.classesDirs
	classpath = sourceSets.shimTest.runtimeClasspath
	useJUnitPlatform()
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Автодетект расширений JUnit: через META-INF/services подхватывается порт
	// EphemeralTestServerProvider и бутстрапит игру до первого теста (см. его beforeAll).
	// Так тесты без @BootstrapMinecraft ведут себя как в NeoForge, где мод уже загружен.
	systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs << "-Xmaxerrs" << "200000"
	it.options.compilerArgs << "-Xmaxwarns" << "1000"
	it.options.deprecation = false
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
// Гайд AE2: markdown-страницы лежат в каталоге `guidebook/` в корне репозитория (как в апстриме),
// а GuideME читает их из ресурсов по пути assets/ae2/ae2guide. Апстрим делает этот перенос в
// своём processResources, в Fabric-сборке его не было - отсюда "Page not found" на любой
// странице гайда и "Data driven guides: []" в логе.
// GuideME — не Fabric-мод: в её джарнике только `neoforge.mods.toml`, `fabric.mod.json` нет,
// поэтому FabricLoader не считает её модом и её `assets/` не попадают в ресурспак. Из-за этого
// спрайты гайда (`assets/guideme/textures/gui/sprites/*`) оказывались missing, а рендер панелей
// падал на "Expected sprite guideme:window to be a nine-slice sprite!".
// Достаём их из джарника на сборке — так они едут в нашем ресурспаке.
configurations {
	guidemeAssets {
		transitive = false
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	guidemeAssets("org.appliedenergistics:guideme:${project.guideme_version}")
}

processResources {
	from('guidebook') {
		into 'assets/ae2/ae2guide'
	}
	from({ configurations.guidemeAssets.collect { zipTree(it) } }) {
		include 'assets/guideme/**'
	}
}